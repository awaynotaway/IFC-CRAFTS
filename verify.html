<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | IFC Crafts</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#fff;
            padding:30px;
            border-radius:12px;
            width:350px;
            box-shadow:0 4px 16px rgba(0,0,0,.1);
        }

        h2{
            margin-bottom:10px;
        }

        p{
            color:#666;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#000;
            color:#fff;
            cursor:pointer;
        }

        button:hover{
            opacity:.9;
        }

        #message{
            margin-top:15px;
            text-align:center;
        }
    </style>
</head>
<body>

    <div class="card">

        <h2>Email Verification</h2>

        <p>
            Enter the verification code sent to your email.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email"
            readonly
        >

        <input
            type="text"
            id="verificationCode"
            placeholder="6-digit verification code"
            maxlength="6"
        >

        <button id="verifyBtn">
            Verify Email
        </button>

        <div id="message"></div>

    </div>

    <script src="/js/auth/verify.js"></script>

</body>
</html>
