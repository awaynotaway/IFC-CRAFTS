<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>IFC Crafts - Reviews</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=The+Seasons&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/style.css" />

    <link rel="stylesheet" href="styles/reviews.css" />

    <link rel="stylesheet" href="user/css/userDashboard.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #fff;
      }
      main.main-wrapper {
        display: block !important;
        width: 100% !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 140px 20px 80px;
        box-sizing: border-box;
      }
      #reviews-section {
        display: block !important;
        width: 100% !important;
        max-width: 900px !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        margin: 0 auto !important;
        padding: 0 !important;
        box-sizing: border-box;
      }
      #reviews-section .reviews-feed-wrapper {
        width: 100%;
        max-width: none;
        text-align: center;
      }
      #reviews-section .reviews-feed-container {
        width: 100%;
        max-width: none;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        box-sizing: border-box;
      }
      #reviewsFeed {
        display: flex !important;
        flex-direction: column;
        gap: 20px;
        width: 100%;
      }
      #reviewsFeed .review-card-item {
        width: 100%;
        max-width: none;
        margin: 0;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .review-card-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
      }
      .review-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 10px;
      }
      .reviewer-info {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .reviewer-info h4 {
        font-size: 1rem;
        font-weight: 700;
        color: #000;
        margin: 0 0 2px;
      }
      .reviewed-product {
        font-size: 0.82rem;
        font-weight: 600;
        color: #64748b;
      }
      .review-stars {
        color: #f59e0b;
        font-size: 0.9rem;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .review-message-text {
        font-size: 0.92rem;
        color: #334155;
        line-height: 1.6;
        margin: 12px 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .review-card-footer {
        display: flex;
        justify-content: flex-end;
        font-size: 0.75rem;
        color: #94a3b8;
      }
      .reviews-status {
        text-align: center;
        color: #64748b;
      }
      .notif-modal-overlay {
        display: none;
      }
      @media (max-width: 600px) {
        main.main-wrapper {
          padding: 110px 16px 50px;
        }
        #reviews-section .reviews-feed-container {
          padding: 16px;
        }
        #reviewsFeed .review-card-item {
          padding: 16px;
        }
        .review-card-header {
          flex-wrap: wrap;
          gap: 8px;
        }
      }

      html,
      body {
        height: auto !important;
        min-height: 100% !important;
        max-height: none !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
      }

      main.main-wrapper,
      #reviews-section,
      .reviews-feed-wrapper,
      .reviews-feed-container,
      #reviewsFeed {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <div class="nav-container">
        <div class="logo-area">
          <img src="pics/Logo.jpg" alt="IFC Crafts Logo" class="nav-logo" />

          <span class="brand-name">IFC CRAFTS</span>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle" />

        <label for="menu-toggle" class="hamburger">
          <span></span>

          <span></span>

          <span></span>
        </label>

        <nav class="nav-links">
          <a href="index.html#home">HOME</a>

          <a href="products.html">PRODUCTS</a>

          <a href="services.html">SERVICES</a>

          <a href="reviews.html" class="active">REVIEWS</a>
        </nav>

        <div class="nav-right-actions" id="navRightActions"></div>
      </div>
    </header>

    <main class="main-wrapper">
      <section
        id="reviews-section"
        class="section-container reviews-page-layout"
      >
        <div class="reviews-feed-wrapper" style="text-align: center">
          <h2 class="gothic-title highlight-text">Customer Reviews</h2>

          <p
            class="subtitle text-black"
            style="
              margin-bottom: 30px;
              font-weight: 700;
              text-transform: uppercase;
              letter-spacing: 1px;
              font-size: 0.9rem;
            "
          >
            What our collectors say
          </p>

          <div class="reviews-feed-container" style="text-align: left">
            <div class="reviews-feed" id="reviewsFeed"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <div class="footer-brand">
          <h3>IFC CRAFTS</h3>

          <p>Handmade • Creative • Student Artists</p>
        </div>

        <div class="footer-socials">
          <h4>Visit Our Pages</h4>

          <div class="social-icons">
            <a
              href="https://www.facebook.com/share/1FCM4HD3Uy/"
              target="_blank"
              class="social-icon fb"
              ><i class="fab fa-facebook-f"></i
            ></a>

            <a
              href="https://www.instagram.com/ifc_crafts"
              target="_blank"
              class="social-icon ig"
              ><i class="fab fa-instagram"></i
            ></a>
          </div>
        </div>

        <div class="footer-contact">
          <h4>Contact Us</h4>

          <p>Email: ifc.artgallery@gmail.com</p>

          <p>Phone: +63 952 678 1122</p>

          <p>Location: Taytay, Rizal</p>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 IFC Crafts. All Rights Reserved.</p>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const isLoggedIn = !!localStorage.getItem("token");

        const navRightActions = document.getElementById("navRightActions");

        if (navRightActions) {
          if (isLoggedIn) {
            navRightActions.innerHTML = `

                        <a href="user/userDashboard.html" class="nav-icon-btn" title="Notifications">

                            <i class="fas fa-bell"></i>

                            <span class="badge" id="notifBadge" style="display: none;">0</span>

                        </a>

                        <a href="user/userCart.html" class="nav-icon-btn" title="Shopping Cart">

                            <i class="fas fa-shopping-cart"></i>

                            <span class="badge" id="cartBadge" style="display: none;">0</span>

                        </a>

                        <a href="user/userDashboard.html" class="nav-icon-btn" title="User Profile">

                            <i class="fas fa-user"></i>

                        </a>

                    `;
          } else {
            navRightActions.innerHTML = `

                        <div id="navAuthArea" class="nav-auth-container">

                            <a href="login.html" class="auth-combined-btn">

                                <i class="fas fa-user"></i>

                                <span class="auth-text">LOGIN/SIGNUP</span>

                            </a>

                        </div>

                    `;
          }
        }
      });

      const reviewsFeed = document.getElementById("reviewsFeed");

      function makeText(tag, className, value) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = value;
        return element;
      }

      async function renderReviews() {
        reviewsFeed.textContent = "Loading reviews...";
        try {
          const response = await fetch("http://localhost:5000/api/reviews");
          if (!response.ok) throw new Error("Failed to load reviews.");
          const result = await response.json();
          const reviews = result.data ?? result;
          if (!Array.isArray(reviews))
            throw new Error("Invalid reviews response.");
          reviewsFeed.replaceChildren();
          if (!reviews.length) {
            reviewsFeed.append(
              makeText("p", "reviews-status", "No reviews yet."),
            );
            return;
          }
          reviews.forEach((review) => {
            const card = document.createElement("article");
            card.className = "review-card-item";
            const header = document.createElement("div");
            header.className = "review-card-header";
            const info = document.createElement("div");
            info.className = "reviewer-info";
            const name =
              [review.first_name, review.last_name].filter(Boolean).join(" ") ||
              review.name ||
              "Customer";
            info.append(makeText("h4", "reviewer-name", name));
            info.append(
              makeText(
                "span",
                "reviewed-product",
                "Reviewed: " +
                  (review.product_name || review.product || "IFC Craft"),
              ),
            );
            const rating = Math.max(
              0,
              Math.min(5, Math.round(Number(review.rating) || 0)),
            );
            const stars = document.createElement("div");
            stars.className = "review-stars";
            stars.setAttribute("aria-label", rating + " out of 5 stars");
            for (let i = 1; i <= 5; i++) {
              const star = document.createElement("i");
              star.className = i <= rating ? "fas fa-star" : "far fa-star";
              star.setAttribute("aria-hidden", "true");
              stars.append(star);
            }
            header.append(info, stars);
            card.append(
              header,
              makeText(
                "p",
                "review-message-text",
                review.review || review.text || "",
              ),
            );
            const dateValue =
              review.created_at || review.review_date || review.date;
            if (dateValue) {
              const date = new Date(dateValue);
              if (!Number.isNaN(date.getTime())) {
                card.append(
                  makeText(
                    "div",
                    "review-card-footer",
                    date.toLocaleDateString("en-US", {
                      month: "long",
                      day: "numeric",
                      year: "numeric",
                    }),
                  ),
                );
              }
            }
            reviewsFeed.append(card);
          });
        } catch (error) {
          console.error("LOAD REVIEWS ERROR:", error);
          reviewsFeed.textContent =
            "Unable to load reviews. Please refresh and try again.";
        }
      }
      document.addEventListener("DOMContentLoaded", renderReviews);

      document.querySelectorAll(".nav-links a").forEach((link) => {
        link.addEventListener("click", () => {
          document.getElementById("menu-toggle").checked = false;
        });
      });
    </script>
  </body>
</html>
