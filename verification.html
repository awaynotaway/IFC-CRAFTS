<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Crafts - Verify Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=The+Seasons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/verification.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo-area">
                <img src="pics/Logo.jpg" alt="IFC Crafts Logo" class="nav-logo">
                <span class="brand-name">IFC CRAFTS</span>
            </div>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="index.html">HOME</a>
                <a href="products.html">PRODUCTS</a>
                <a href="services.html">SERVICES</a>
                <a href="reviews.html">REVIEWS</a>
            </nav>

            <div class="nav-right-actions" id="navRightActions">
                <div id="navAuthArea" class="nav-auth-container">
                    <a href="login.html" class="auth-combined-btn">
                        <i class="fas fa-user"></i>
                        <span class="auth-text">LOGIN/SIGNUP</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="auth-page-wrapper">
        <div class="auth-card-container">
            <img src="pics/Logo.jpg" alt="IFC Crafts Logo" class="auth-page-logo">
            
            <h1 class="auth-heading">Verify Account</h1>

            <form id="verifyForm" class="custom-auth-form">
                <div class="custom-input-group">
                    <label for="code">Code:</label>
                    <input type="text" id="code" name="code" required placeholder="Type the code...">
                </div>

                <div class="auth-btn-wrapper">
                    <button type="submit" class="btn-black-submit">CONFIRM</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <h3>IFC CRAFTS</h3>
                <p>Handmade • Creative • Student Artists</p>
            </div>
           
            <div class="footer-socials">
                <h4>Visit Our Pages</h4>
                <div class="social-icons">
                    <a href="https://www.facebook.com/share/1FCM4HD3Uy/" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/ifc_crafts" target="_blank" class="social-icon ig"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
           
            <div class="footer-contact">
                <h4>Contact Us</h4>
                <p>Email: ifc.artgallery@gmail.com</p>
                <p>Phone: +63 952 678 1122</p>
                <p>Location: Taytay, Rizal</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 IFC Crafts. All Rights Reserved.</p>
        </div>
    </footer>

    <script>

document.querySelectorAll(
    '.nav-links a'
).forEach(link => {

    link.addEventListener(
        'click',
        () => {

            document.getElementById(
                'menu-toggle'
            ).checked = false;

        }
    );

});

const email =
new URLSearchParams(
    window.location.search
).get("email");

console.log(
    "EMAIL:",
    email
);

document
.getElementById(
    "verifyForm"
)
.addEventListener(
    "submit",
    async function(e) {

        e.preventDefault();

        const code =
            document
            .getElementById(
                "code"
            )
            .value
            .trim();

        const response =
            await fetch(
                "http://localhost:5000/api/auth/verify-reset-code",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        code
                    })
                }
            );

        const result =
            await response.json();

        if (
            result.success
        ) {

            window.location.href =
            `createNewPassword.html?email=${encodeURIComponent(
                email
            )}`;

        }
        else {

            alert(
                result.message
            );

        }

    }
);

</script>
</body>
</html>
