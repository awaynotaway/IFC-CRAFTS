<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Crafts - My Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=The+Seasons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="css/userDashboard.css">
    <link rel="stylesheet" href="css/userOrder.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-area">
                <img src="../pictures/IFCLogo.jpg" alt="IFC Crafts Logo" class="nav-logo">
                <span class="brand-name">IFC CRAFTS</span>
            </div>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="../products.html">PRODUCTS</a>
                <a href="../services.html">SERVICES</a>
                <a href="../reviews.html">REVIEWS</a>
            </nav>

            <div class="nav-right-actions">
                <button type="button" class="nav-icon-btn notification-bell-btn" id="notifModalBtn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="navNotifBadge" style="display: none;">0</span>
                </button>
                <a href="userCart.html" class="nav-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>
                <a href="profile.html" class="profile-icon-only active" title="User Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Notification List Modal -->
    <div class="notif-modal-overlay" id="notifModalOverlay">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3>Notifications</h3>
                <button type="button" class="close-notif-modal" id="closeNotifModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="notifModalList">
                <div class="empty-notif-message">No notifications found.</div>
            </div>
        </div>
    </div>

    <!-- Detailed Notification Modal -->
    <div class="notif-modal-overlay" id="detailNotifModalOverlay" style="z-index: 1200;">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3 id="detailNotifTitle">Notification Details</h3>
                <button type="button" class="close-notif-modal" id="closeDetailModal">&times;</button>
            </div>
            <div class="notif-modal-body" style="display: flex; flex-direction: column; gap: 15px;">
                <p id="detailNotifMessage" style="font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;"></p>
                <span id="detailNotifTime" style="font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #94a3b8;"></span>
            </div>
        </div>
    </div>

    <!-- Order Receipt Modal -->
    <div class="notif-modal-overlay" id="orderReceiptModalOverlay" style="z-index: 1300;">
        <div class="notif-modal-content" style="max-width: 480px;">
            <div class="notif-modal-header">
                <h3>Order Summary</h3>
                <button type="button" class="close-notif-modal" id="closeReceiptModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="receiptModalBody" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-wrapper">
        
        <aside class="dashboard-sidebar">
            <div class="sidebar-menu-group">
                <a href="userDashboard.html" class="sidebar-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="userOrder.html" class="sidebar-item active">
                    <i class="fas fa-clipboard-list"></i> Orders & Transactions
                </a>
                <a href="pendingOrders.html" class="sidebar-item">
                    <i class="fas fa-clock"></i> Pending Orders
                </a>
                <a href="userMessage.html" class="sidebar-item">
                    <i class="fas fa-comments"></i> Messages
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            </div>
            
            <div style="padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.08);">
                <a href="#" id="logoutBtn" class="sidebar-item logout-btn" style="color: #dc3545; background-color: #fff5f5;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <main class="dashboard-main-content">
            <div class="transaction-container-box">
                <div class="transaction-main-header">
                    <h1>My Orders & Transactions</h1>
                    <p>Track your processing orders and view your transaction history.</p>
                </div>

                <!-- Transaction Toolbar -->
                <div class="transaction-toolbar" style="justify-content: flex-start;">
                    <div class="search-bar-wrapper" style="max-width: 100%; flex: 1;">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="transactionSearch" placeholder="Search Orders & Transactions..." class="search-input">
                    </div>
                </div>

                <!-- Dropdown Filters Bar -->
                <div class="transaction-filters-bar" style="padding: 12px 30px; border-bottom: 1px solid #e2e8f0; background: #ffffff; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; flex-shrink: 0;">
                    <div class="filter-dropdown-group">
                        <label for="statusFilterSelect" style="font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: #64748b; margin-right: 6px;">Status:</label>
                        <select id="statusFilterSelect" class="filter-dropdown">
                            <option value="all">All Status</option>
                            <option value="process">Processing</option>
                            <option value="completed">Completed</option>
                            <option value="pending">Pending</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="filter-dropdown-group">
                        <label for="monthFilterSelect" style="font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: #64748b; margin-right: 6px;">Month:</label>
                        <select id="monthFilterSelect" class="filter-dropdown">
                            <option value="all">All Months</option>
                            <option value="01">January</option>
                            <option value="02">February</option>
                            <option value="03">March</option>
                            <option value="04">April</option>
                            <option value="05">May</option>
                            <option value="06">June</option>
                            <option value="07">July</option>
                            <option value="08">August</option>
                            <option value="09">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>

                    <div class="filter-dropdown-group">
                        <label for="yearFilterSelect" style="font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600; color: #64748b; margin-right: 6px;">Year:</label>
                        <select id="yearFilterSelect" class="filter-dropdown">
                            <option value="all">All Years</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                        </select>
                    </div>
                </div>

                <div class="transactions-list" id="ordersListContainer"></div>
            </div>
        </main>
    </div>

    <!-- Order Details Modal (Updated to include Personal Info and Proof of Payment) -->
    <div id="orderModal" class="order-modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1300; align-items: center; justify-content: center;">
        <div class="order-modal-content" style="background: #fff; width: 100%; max-width: 480px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                <h2 style="font-size: 1.1rem; font-weight: 700; margin: 0;">Order Summary</h2>
                <button id="closeModalBtn" class="close-modal" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;">&times;</button>
            </div>
            <div class="modal-body" id="modalBodyContent" style="display: flex; flex-direction: column; gap: 12px;"></div>
            <div class="modal-footer" style="padding-top: 10px; border-top: 1px solid #e2e8f0; text-align: right;">
                <button id="closeModalActionBtn" class="modal-btn-close" style="background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Close</button>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('menu-toggle').checked = false;
            });
        });

        const notifBtn = document.getElementById('notifModalBtn');
        const notifOverlay = document.getElementById('notifModalOverlay');
        const closeNotifBtn = document.getElementById('closeNotifModal');
        const detailOverlay = document.getElementById('detailNotifModalOverlay');
        const closeDetailBtn = document.getElementById('closeDetailModal');
        const receiptOverlay = document.getElementById('orderReceiptModalOverlay');
        const closeReceiptBtn = document.getElementById('closeReceiptModal');

        if (notifBtn) notifBtn.addEventListener('click', () => { notifOverlay.style.display = 'flex'; loadModalNotifications(); });
        if (closeNotifBtn) closeNotifBtn.addEventListener('click', () => { notifOverlay.style.display = 'none'; });
        if (closeDetailBtn) closeDetailBtn.addEventListener('click', () => { detailOverlay.style.display = 'none'; });
        if (closeReceiptBtn) closeReceiptBtn.addEventListener('click', () => { receiptOverlay.style.display = 'none'; });

        window.addEventListener('click', (e) => {
            if (e.target === notifOverlay) notifOverlay.style.display = 'none';
            if (e.target === detailOverlay) detailOverlay.style.display = 'none';
            if (e.target === receiptOverlay) receiptOverlay.style.display = 'none';
        });

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('ifc_user_firstname');
                localStorage.removeItem('isLoggedIn');
                window.location.href = '../index.html';
            });

            const urlParams = new URLSearchParams(window.location.search);
            const statusParam = urlParams.get('status');
            if (statusParam) {
                const statusSelect = document.getElementById('statusFilterSelect');
                if (statusSelect) {
                    statusSelect.value = statusParam;
                }
            }

            loadAndRenderCombinedOrdersAndTransactions();
            const notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            updateNotificationBadge(notifications);
        });

        function getStatusBadgeClass(status) {
            if (!status) return 'process';
            const s = status.toLowerCase();
            if (s === 'complete' || s === 'completed') return 'completed';
            if (s === 'verified') return 'verified';
            if (s === 'pending') return 'pending';
            if (s === 'rejected' || s === 'cancelled') return 'rejected';
            if (s === 'process' || s === 'processing' || s === 'shipping') return 'process';
            return 'process';
        }

        function loadAndRenderCombinedOrdersAndTransactions() {
            const container = document.getElementById('ordersListContainer');
            const storedOrders = JSON.parse(localStorage.getItem('ifc_user_orders')) || [];
            const storedTransactions = JSON.parse(localStorage.getItem('ifc_user_transactions')) || [];

            const combinedList = [...storedOrders, ...storedTransactions];

            container.innerHTML = '';
            if (combinedList.length === 0) {
                container.innerHTML = `<div style="padding: 30px; text-align: center; color: #64748b; font-family: 'Inter', sans-serif;">No orders or transaction history found.</div>`;
                return;
            }

            combinedList.forEach(item => {
                const status = item.status || 'processing';
                const statusClass = getStatusBadgeClass(status);
                const displayStatus = status.charAt(0).toUpperCase() + status.slice(1);
                const itemDate = item.date || '';

                const card = document.createElement('div');
                card.className = 'transaction-card-item';
                card.setAttribute('data-status', statusClass);
                card.setAttribute('data-date', itemDate);
                card.setAttribute('data-id', item.id);
                card.setAttribute('data-product', item.product || item.name);
                card.setAttribute('data-craft', item.craft || 'Handmade Craft');
                card.setAttribute('data-qty', item.qty || item.quantity || 1);
                card.setAttribute('data-price', item.price || item.total);
                card.setAttribute('data-shipping', item.shipping || 'Taytay, Rizal');
                card.setAttribute('data-payment', item.payment || 'GCash');
                card.setAttribute('data-image', item.image || '../pictures/necklace.jpg');
                card.setAttribute('data-customer', item.customerName || 'Juan Dela Cruz');
                card.setAttribute('data-contact', item.contactNumber || '09123456789');
                card.setAttribute('data-receipt', item.receiptImage || '');

                card.innerHTML = `
                    <div class="tx-card-header">
                        <span class="order-id-label">Order# ${item.id}</span>
                        <span class="tx-date">${item.date}</span>
                    </div>
                    <div class="tx-card-body">
                        <div class="product-preview">
                            <img src="${item.image || '../pictures/necklace.jpg'}" alt="${item.product || item.name}" class="tx-product-img" onerror="this.src='../pictures/necklace.jpg'">
                            <div class="tx-product-info">
                                <h3>${item.product || item.name}</h3>
                                <p class="craft-type">${item.craft || 'Handmade Craft'}</p>
                                <p class="qty-text">Qty.: ${item.qty || item.quantity || 1}</p>
                            </div>
                        </div>
                        <div class="tx-card-meta">
                            <div class="total-price-group">
                                <span class="total-label">Total:</span>
                                <span class="total-amount">${item.price || item.total}</span>
                            </div>
                            <div class="tx-action-group">
                                <span class="status-badge ${statusClass}">${displayStatus}</span>
                                <a href="#" class="view-details-link">View Details</a>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            initSearchAndModalListeners();
            initFilterListeners();
            filterOrders();
        }

        function filterOrders() {
            const searchInput = document.getElementById('transactionSearch');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const statusVal = document.getElementById('statusFilterSelect').value;
            const monthVal = document.getElementById('monthFilterSelect').value;
            const yearVal = document.getElementById('yearFilterSelect').value;
            const transactionCards = document.querySelectorAll('.transaction-card-item');

            transactionCards.forEach(card => {
                const textContent = card.textContent.toLowerCase();
                const cardStatus = card.getAttribute('data-status');
                const cardDateStr = card.getAttribute('data-date');

                const matchesSearch = textContent.includes(searchTerm);
                const matchesStatus = (statusVal === 'all') || (cardStatus === statusVal);

                let matchesMonth = true;
                let matchesYear = true;

                if (monthVal !== 'all' || yearVal !== 'all') {
                    const parsedDate = new Date(cardDateStr);
                    if (!isNaN(parsedDate)) {
                        const cardMonth = String(parsedDate.getMonth() + 1).padStart(2, '0');
                        const cardYear = String(parsedDate.getFullYear());

                        if (monthVal !== 'all' && cardMonth !== monthVal) matchesMonth = false;
                        if (yearVal !== 'all' && cardYear !== yearVal) matchesYear = false;
                    } else {
                        if (monthVal !== 'all' && !cardDateStr.toLowerCase().includes(getMonthName(monthVal).toLowerCase())) {
                            matchesMonth = false;
                        }
                        if (yearVal !== 'all' && !cardDateStr.includes(yearVal)) {
                            matchesYear = false;
                        }
                    }
                }

                if (matchesSearch && matchesStatus && matchesMonth && matchesYear) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function getMonthName(monthNum) {
            const months = {
                '01': 'January', '02': 'February', '03': 'March', '04': 'April',
                '05': 'May', '06': 'June', '07': 'July', '08': 'August',
                '09': 'September', '10': 'October', '11': 'November', '12': 'December'
            };
            return months[monthNum] || '';
        }

        function initFilterListeners() {
            document.getElementById('statusFilterSelect').addEventListener('change', filterOrders);
            document.getElementById('monthFilterSelect').addEventListener('change', filterOrders);
            document.getElementById('yearFilterSelect').addEventListener('change', filterOrders);
        }

        function initSearchAndModalListeners() {
            const searchInput = document.getElementById('transactionSearch');
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    filterOrders();
                });
            }

            const modal = document.getElementById('orderModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const closeModalActionBtn = document.getElementById('closeModalActionBtn');
            const modalBodyContent = document.getElementById('modalBodyContent');

            document.querySelectorAll('.view-details-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const card = e.target.closest('.transaction-card-item');
                    
                    const id = card.getAttribute('data-id');
                    const product = card.getAttribute('data-product');
                    const craft = card.getAttribute('data-craft');
                    const qty = card.getAttribute('data-qty');
                    const price = card.getAttribute('data-price');
                    const date = card.getAttribute('data-date');
                    const shipping = card.getAttribute('data-shipping');
                    const payment = card.getAttribute('data-payment');
                    const statusClass = card.getAttribute('data-status');
                    const image = card.getAttribute('data-image');
                    const customerName = card.getAttribute('data-customer');
                    const contactNumber = card.getAttribute('data-contact');
                    const receiptImage = card.getAttribute('data-receipt');
                    const displayStatus = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);

                    const rawPriceStr = price ? price.replace(/[^\d.]/g, '') : '0';
                    const totalPrice = parseFloat(rawPriceStr) || 0;
                    let vatAmount = totalPrice * 0.12;
                    let subtotal = totalPrice - vatAmount;

                    modalBodyContent.innerHTML = `
                        <div style="border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; margin-bottom: 5px;">
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Order ID: <strong>#${id}</strong></p>
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Date: ${date}</p>
                            <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #64748b;">Status: <span class="status-badge ${statusClass}" style="display: inline-block; padding: 2px 8px; font-size: 0.75rem;">${displayStatus}</span></p>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-box-open"></i> Product Information
                            </div>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img src="${image}" alt="Product" style="width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0;" onerror="this.src='../pictures/necklace.jpg'">
                                <div>
                                    <h4 style="margin: 0; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; color: #000;">${product}</h4>
                                    <p style="margin: 2px 0 0; font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #64748b;">Craft: ${craft} | Qty: ${qty}</p>
                                </div>
                            </div>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Subtotal</span>
                                <span>₱${subtotal.toFixed(2)}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>VAT (12%)</span>
                                <span>₱${vatAmount.toFixed(2)}</span>
                            </div>
                        </div>

                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-truck"></i> Delivery Information
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Delivery Method</span>
                                <span>Delivery</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>Location</span>
                                <span>${shipping}</span>
                            </div>
                        </div>

                        <!-- Personal Information Box Added -->
                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-user-circle"></i> Personal Information
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Name</span>
                                <strong style="color: #000;">${customerName}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px;">
                                <span>Contact Number</span>
                                <strong style="color: #000;">${contactNumber}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                                <span>Address</span>
                                <span style="text-align: right; max-width: 200px; color: #000;">${shipping}</span>
                            </div>
                        </div>

                        <!-- Payment Information & Proof of Payment Added -->
                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <div style="font-weight: 700; font-size: 0.85rem; margin-bottom: 8px; color: #334155;">
                                <i class="fas fa-credit-card"></i> Payment Information
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px;">
                                <span>Method</span>
                                <strong style="text-transform: uppercase;">${payment}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                                <span>Proof of Payment</span>
                                ${receiptImage ? `<a href="${receiptImage}" target="_blank"><img src="${receiptImage}" alt="Proof" style="width: 45px; height: 55px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc;"></a>` : '<span style="color: #777;">No Image</span>'}
                            </div>
                        </div>

                        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 1rem;">
                            <strong style="color: #000;">Total Amount</strong>
                            <strong style="color: #2e7d32; font-size: 1.1rem;">${price}</strong>
                        </div>
                    `;

                    modal.style.display = 'flex';
                });
            });

            function closeModal() { modal.style.display = 'none'; }
            if (closeModalBtn) closeModalBtn.onclick = closeModal;
            if (closeModalActionBtn) closeModalActionBtn.onclick = closeModal;
            window.onclick = (e) => { if (e.target === modal) closeModal(); };
        }

        function loadModalNotifications() {
            let notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            const notifListContainer = document.getElementById('notifModalList');
            if (notifications.length === 0) {
                notifListContainer.innerHTML = `<div class="empty-notif-message">No notifications found.</div>`;
                return;
            }
            notifListContainer.innerHTML = '';
            notifications.forEach((notif, index) => {
                const div = document.createElement('div');
                div.className = `notif-item-popup ${notif.unread ? 'unread' : ''}`;
                div.innerHTML = `
                    <div class="notif-title">${notif.title || 'Notification'}</div>
                    <div class="notif-desc">${notif.message || notif.desc}</div>
                    <div class="notif-time">${notif.time || 'Just now'}</div>
                `;
                div.addEventListener('click', () => {
                    document.getElementById('detailNotifTitle').textContent = notif.title || 'Notification Details';
                    document.getElementById('detailNotifMessage').textContent = notif.message || notif.desc || 'No message available.';
                    document.getElementById('detailNotifTime').textContent = notif.time || 'Just now';
                    detailOverlay.style.display = 'flex';
                    if (notif.unread) {
                        notif.unread = false;
                        notifications[index] = notif;
                        localStorage.setItem('ifc_user_notifications', JSON.stringify(notifications));
                        div.classList.remove('unread');
                        updateNotificationBadge(notifications);
                    }
                });
                notifListContainer.appendChild(div);
            });
        }

        function updateNotificationBadge(notifications) {
            const unreadCount = notifications.filter(n => n.unread === true).length;
            const badge = document.getElementById('navNotifBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    </script>
</body>
</html>
