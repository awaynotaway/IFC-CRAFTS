<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Crafts - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=The+Seasons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="css/pendingOrders.css">
    <link rel="stylesheet" href="css/userMessage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-area">
                <img src="../pictures/IFCLogo.jpg" alt="IFC Crafts Logo" class="nav-logo">
                <span class="brand-name">IFC CRAFTS</span>
            </div>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="../products.html">PRODUCTS</a>
                <a href="../services.html">SERVICES</a>
                <a href="../reviews.html">REVIEWS</a>
            </nav>

            <div class="nav-right-actions">
                <!-- Notification Bell Icon -->
                <button type="button" class="nav-icon-btn notification-bell-btn" id="notifModalBtn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="navNotifBadge" style="display: none;">0</span>
                </button>

                <!-- Cart Icon -->
                <a href="userCart.html" class="nav-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>

                <!-- Profile Icon -->
                <a href="profile.html" class="profile-icon-only" title="User Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Notification List Modal / Pop-up -->
    <div class="notif-modal-overlay" id="notifModalOverlay">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3>Notifications</h3>
                <button type="button" class="close-notif-modal" id="closeNotifModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="notifModalList">
                <div class="empty-notif-message">No notifications found.</div>
            </div>
        </div>
    </div>

    <!-- Detailed Single Notification Message Modal -->
    <div class="notif-modal-overlay" id="detailNotifModalOverlay" style="z-index: 1200;">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3 id="detailNotifTitle">Notification Details</h3>
                <button type="button" class="close-notif-modal" id="closeDetailModal">&times;</button>
            </div>
            <div class="notif-modal-body" style="display: flex; flex-direction: column; gap: 15px;">
                <p id="detailNotifMessage" style="font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;"></p>
                <span id="detailNotifTime" style="font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #94a3b8;"></span>
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-wrapper">
        
        <!-- Sidebar Navigation (Sync with userOrder) -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-menu-group">
                <a href="userDashboard.html" class="sidebar-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="userOrder.html" class="sidebar-item">
                    <i class="fas fa-clipboard-list"></i> Orders & Transactions
                </a>
                <a href="pendingOrders.html" class="sidebar-item">
                    <i class="fas fa-clock"></i> Pending Orders
                </a>
                <a href="userMessage.html" class="sidebar-item active">
                    <i class="fas fa-comments"></i> Messages
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            </div>
            
            <div style="padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.08);">
                <a href="#" id="logoutBtn" class="sidebar-item logout-btn" style="color: #dc3545; background-color: #fff5f5;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-main-content">
            
            <!-- Messages Content Box -->
            <div class="dashboard-content-area" style="width: 100%;">
                <div class="content-header-box" style="margin-bottom: 20px;">
                    <h1>Messages</h1>
                </div>

                <!-- Chat Box -->
                <div class="chat-container-box">
                    <div class="chat-header-title">
                        <div class="chat-header-name">IFC CRAFTS</div>
                        <div class="chat-status-indicator">
                            <span class="status-dot active"></span>
                            <span class="status-text">Active</span>
                        </div>
                    </div>

                    <!-- Scrollable Messages -->
                    <div class="chat-messages-scroll" id="chatMessagesScroll">
                        <div class="chat-bubble admin">
                            Your order is now In Processing.
                        </div>
                    </div>

                    <!-- Input Footer -->
                    <div class="chat-input-footer">
                        <!-- Attachment Popup Menu -->
                        <div class="attachment-popup-menu" id="attachmentMenu">
                            <button class="attachment-option" onclick="triggerFileInput('file')">
                                <i class="fas fa-folder"></i> Send file
                            </button>
                            <button class="attachment-option" onclick="triggerFileInput('image')">
                                <i class="fas fa-image"></i> Send Picture
                            </button>
                        </div>

                        <!-- Hidden File Inputs -->
                        <input type="file" id="hiddenFileInput" style="display: none;" onchange="handleFileSelected(event)">

                        <input type="text" class="chat-text-input" id="chatInputText" placeholder="Send message..." onkeypress="checkEnterKey(event)">
                        
                        <button class="chat-action-btn" onclick="sendMessage()" title="Send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                        <button class="chat-action-btn" onclick="toggleAttachmentMenu()" title="Add Attachment">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Logic -->
    <script>
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('menu-toggle').checked = false;
            });
        });

        const notifBtn = document.getElementById('notifModalBtn');
        const notifOverlay = document.getElementById('notifModalOverlay');
        const closeNotifBtn = document.getElementById('closeNotifModal');
        const detailOverlay = document.getElementById('detailNotifModalOverlay');
        const closeDetailBtn = document.getElementById('closeDetailModal');

        if (notifBtn) {
            notifBtn.addEventListener('click', () => {
                notifOverlay.style.display = 'flex';
                loadModalNotifications();
            });
        }
        if (closeNotifBtn) {
            closeNotifBtn.addEventListener('click', () => {
                notifOverlay.style.display = 'none';
            });
        }
        if (closeDetailBtn) {
            closeDetailBtn.addEventListener('click', () => {
                detailOverlay.style.display = 'none';
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target === notifOverlay) notifOverlay.style.display = 'none';
            if (e.target === detailOverlay) detailOverlay.style.display = 'none';
        });

        let chatMessages = JSON.parse(localStorage.getItem('ifc_user_messages')) || [
            { sender: 'admin', text: 'Your order is now In Processing.', type: 'text' }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const logoutBtnEl = document.getElementById('logoutBtn');
            if (logoutBtnEl) {
                logoutBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('ifc_user_firstname');
                    window.location.href = '../index.html';
                });
            }

            const notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            updateNotificationBadge(notifications);

            renderMessages();
        });

        function loadModalNotifications() {
            let notifications = JSON.parse(localStorage.getItem('ifc_user_notifications')) || [];
            const notifListContainer = document.getElementById('notifModalList');

            if (notifications.length === 0) {
                notifListContainer.innerHTML = `<div class="empty-notif-message">No notifications found.</div>`;
                return;
            }

            notifListContainer.innerHTML = '';
            notifications.forEach((notif, index) => {
                const div = document.createElement('div');
                div.className = `notif-item-popup ${notif.unread ? 'unread' : ''}`;
                div.innerHTML = `
                    <div class="notif-title">${notif.title || 'Notification'}</div>
                    <div class="notif-desc">${notif.message || notif.desc}</div>
                    <div class="notif-time">${notif.time || 'Just now'}</div>
                `;
                
                div.addEventListener('click', () => {
                    document.getElementById('detailNotifTitle').textContent = notif.title || 'Notification Details';
                    document.getElementById('detailNotifMessage').textContent = notif.message || notif.desc || 'No message available.';
                    document.getElementById('detailNotifTime').textContent = notif.time || 'Just now';

                    detailOverlay.style.display = 'flex';

                    if (notif.unread) {
                        notif.unread = false;
                        notifications[index] = notif;
                        localStorage.setItem('ifc_user_notifications', JSON.stringify(notifications));
                        div.classList.remove('unread');
                        updateNotificationBadge(notifications);
                    }
                });

                notifListContainer.appendChild(div);
            });
        }

        function updateNotificationBadge(notifications) {
            const unreadCount = notifications.filter(n => n.unread === true).length;
            const badge = document.getElementById('navNotifBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function renderMessages() {
            const scrollContainer = document.getElementById('chatMessagesScroll');
            scrollContainer.innerHTML = '';

            chatMessages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `chat-bubble ${msg.sender}`;
                
                if (msg.type === 'image') {
                    bubble.innerHTML = `<img src="${msg.content}" alt="Sent Image">`;
                } else if (msg.type === 'file') {
                    bubble.innerHTML = `<i class="fas fa-file-alt"></i> File: ${msg.filename}`;
                } else {
                    bubble.textContent = msg.text;
                }

                scrollContainer.appendChild(bubble);
            });

            scrollContainer.scrollTop = scrollContainer.scrollHeight;
        }

        function sendMessage() {
            const inputField = document.getElementById('chatInputText');
            const text = inputField.value.trim();

            if (text === '') return;

            chatMessages.push({ sender: 'user', text: text, type: 'text' });
            saveAndRender();
            inputField.value = '';

            setTimeout(() => {
                chatMessages.push({ sender: 'admin', text: 'Thank you for your message! Our admin will get back to you shortly.', type: 'text' });
                saveAndRender();
            }, 1000);
        }

        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachmentMenu');
            menu.classList.toggle('active');
        }

        let currentUploadType = 'image';
        function triggerFileInput(type) {
            currentUploadType = type;
            const fileInput = document.getElementById('hiddenFileInput');
            if (type === 'image') {
                fileInput.accept = 'image/*';
            } else {
                fileInput.accept = '.pdf,.doc,.docx,.txt';
            }
            fileInput.click();
            toggleAttachmentMenu();
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (currentUploadType === 'image') {
                        chatMessages.push({ sender: 'user', content: e.target.result, type: 'image' });
                    } else {
                        chatMessages.push({ sender: 'user', filename: file.name, type: 'file' });
                    }
                    saveAndRender();
                }
                reader.readAsDataURL(file);
            }
        }

        function saveAndRender() {
            localStorage.setItem('ifc_user_messages', JSON.stringify(chatMessages));
            renderMessages();
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('attachmentMenu');
            const plusBtn = document.querySelector('.chat-action-btn:last-child');
            if (menu && plusBtn && !menu.contains(e.target) && !plusBtn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
