<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Crafts - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=The+Seasons&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="css/pendingOrders.css">
    <link rel="stylesheet" href="css/userMessage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-area">
                <img src="../pictures/IFCLogo.jpg" alt="IFC Crafts Logo" class="nav-logo">
                <span class="brand-name">IFC CRAFTS</span>
            </div>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-links">
                <a href="../index.html">HOME</a>
                <a href="../products.html">PRODUCTS</a>
                <a href="../services.html">SERVICES</a>
                <a href="../reviews.html">REVIEWS</a>
            </nav>

            <div class="nav-right-actions">
                <!-- Notification Bell Icon -->
                <button type="button" class="nav-icon-btn notification-bell-btn" id="notifModalBtn" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge" id="navNotifBadge" style="display: none;">0</span>
                </button>

                <!-- Cart Icon -->
                <a href="userCart.html" class="nav-icon-btn" title="Shopping Cart">
                    <i class="fas fa-shopping-cart"></i>
                </a>

                <!-- Profile Icon -->
                <a href="profile.html" class="profile-icon-only" title="User Profile">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Notification List Modal / Pop-up -->
    <div class="notif-modal-overlay" id="notifModalOverlay">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3>Notifications</h3>
                <button type="button" class="close-notif-modal" id="closeNotifModal">&times;</button>
            </div>
            <div class="notif-modal-body" id="notifModalList">
                <div class="empty-notif-message">No notifications found.</div>
            </div>
        </div>
    </div>

    <!-- Detailed Single Notification Message Modal -->
    <div class="notif-modal-overlay" id="detailNotifModalOverlay" style="z-index: 1200;">
        <div class="notif-modal-content">
            <div class="notif-modal-header">
                <h3 id="detailNotifTitle">Notification Details</h3>
                <button type="button" class="close-notif-modal" id="closeDetailModal">&times;</button>
            </div>
            <div class="notif-modal-body" style="display: flex; flex-direction: column; gap: 15px;">
                <p id="detailNotifMessage" style="font-family: 'Inter', sans-serif; font-size: 0.95rem; color: #334155; line-height: 1.5; margin: 0;"></p>
                <span id="detailNotifTime" style="font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #94a3b8;"></span>
            </div>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-wrapper">
        
        <!-- Sidebar Navigation (Sync with userOrder) -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-menu-group">
                <a href="userDashboard.html" class="sidebar-item">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="userOrder.html" class="sidebar-item">
                    <i class="fas fa-clipboard-list"></i> Orders & Transactions
                </a>
                <a href="pendingOrders.html" class="sidebar-item">
                    <i class="fas fa-clock"></i> Pending Orders
                </a>
                <a href="userMessage.html" class="sidebar-item active">
                    <i class="fas fa-comments"></i> Messages
                </a>
                <a href="profile.html" class="sidebar-item">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            </div>
            
            <div style="padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.08);">
                <a href="#" id="logoutBtn" class="sidebar-item logout-btn" style="color: #dc3545; background-color: #fff5f5;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-main-content">
            
            <!-- Messages Content Box -->
            <div class="dashboard-content-area" style="width: 100%;">
                <div class="content-header-box" style="margin-bottom: 20px;">
                    <h1>Messages</h1>
                </div>

                <!-- Chat Box -->
                <div class="chat-container-box">
                    <div class="chat-header-title">
                        <div class="chat-header-name">IFC CRAFTS</div>
                        <div class="chat-status-indicator">
                            <span class="status-dot active"></span>
                            <span class="status-text">Active</span>
                        </div>
                    </div>

                    <!-- Scrollable Messages -->
                <div class="chat-messages-scroll" id="chatMessagesScroll">
</div>
                    <!-- Input Footer -->
                    <div class="chat-input-footer">
                        <!-- Attachment Popup Menu -->
                        <div class="attachment-popup-menu" id="attachmentMenu">
                            <button class="attachment-option" onclick="triggerFileInput('file')">
                                <i class="fas fa-folder"></i> Send file
                            </button>
                            <button class="attachment-option" onclick="triggerFileInput('image')">
                                <i class="fas fa-image"></i> Send Picture
                            </button>
                        </div>

                        <!-- Hidden File Inputs -->
                        <input type="file" id="hiddenFileInput" style="display: none;" onchange="handleFileSelected(event)">

                        <input type="text" class="chat-text-input" id="chatInputText" placeholder="Send message..." onkeypress="checkEnterKey(event)">
                        
                        <button class="chat-action-btn" onclick="sendMessage()" title="Send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                        <button class="chat-action-btn" onclick="toggleAttachmentMenu()" title="Add Attachment">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Logic -->

    <div id="myModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
z-index:99999;
">

    <div
    style="
    background:white;
    width:90%;
    margin:50px auto;
    padding:20px;
    border-radius:10px;
    ">

        <h2>REQUEST DETAILS</h2>

        <div id="modalContent">
            TEST
        </div>

        <br>

        <button onclick="closeModal()">
            Close
        </button>

    </div>

</div>
    <script>
        let selectedRequest = null;
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('menu-toggle').checked = false;
            });
        });

        const notifBtn = document.getElementById('notifModalBtn');
        const notifOverlay = document.getElementById('notifModalOverlay');
        const closeNotifBtn = document.getElementById('closeNotifModal');
        const detailOverlay = document.getElementById('detailNotifModalOverlay');
        const closeDetailBtn = document.getElementById('closeDetailModal');

        if (notifBtn) {

    notifBtn.addEventListener(
        "click",
        async () => {

            notifOverlay.style.display =
                "flex";

            const token =
                localStorage.getItem(
                    "token"
                );

            await fetch(
                "http://localhost:5000/api/notifications/read-all",
                {
                    method: "PUT",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

            await renderNotificationModal();

            loadNotificationBadge();

        }
    );

}
        if (closeNotifBtn) {
            closeNotifBtn.addEventListener('click', () => {
                notifOverlay.style.display = 'none';
            });
        }
        if (closeDetailBtn) {
            closeDetailBtn.addEventListener('click', () => {
                detailOverlay.style.display = 'none';
            });
        }

        window.addEventListener('click', (e) => {
            if (e.target === notifOverlay) notifOverlay.style.display = 'none';
            if (e.target === detailOverlay) detailOverlay.style.display = 'none';
        });

        let activeChatId = null;
let chatMessages = [];

        document.addEventListener("DOMContentLoaded", () => {
            const logoutBtnEl = document.getElementById('logoutBtn');
            if (logoutBtnEl) {
                logoutBtnEl.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('ifc_user_firstname');
                    window.location.href = '../index.html';
                });
            }

     loadNotificationBadge();

            loadChat();
        });

        
        async function renderNotificationModal() {

    try {

        const token =
            localStorage.getItem(
                "token"
            );

        const response =
            await fetch(
                "http://localhost:5000/api/notifications",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        const notifications =
            data.data || [];

        const container =
            document.getElementById(
                "notifModalList"
            );

        container.innerHTML = "";

        if (
            notifications.length === 0
        ) {

            container.innerHTML =
                `
                <div class="empty-notif-message">
                    No notifications found.
                </div>
                `;

            return;

        }

        notifications.forEach(
            notif => {

                container.innerHTML +=
                `
                <div class="notif-item-popup">

                    <div class="notif-title">
                        ${notif.title}
                    </div>

                    <div class="notif-desc">
                        ${notif.message}
                    </div>

                    <div class="notif-time">
                        ${new Date(
                            notif.created_at
                        ).toLocaleString()}
                    </div>

                </div>
                `;

            }
        );

    }
    catch(error) {

        console.error(error);

    }

}

async function loadNotificationBadge() {

    try {

        const token =
            localStorage.getItem(
                "token"
            );

        const response =
            await fetch(
                "http://localhost:5000/api/notifications",
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        const data =
            await response.json();

        const unreadCount =
            (data.data || [])
                .filter(
                    notif =>
                        notif.is_read === 0
                )
                .length;

        const badge =
            document.getElementById(
                "navNotifBadge"
            );

        if (unreadCount > 0) {

            badge.textContent =
                unreadCount;

            badge.style.display =
                "inline-block";

        } else {

            badge.style.display =
                "none";

        }

    }
    catch(error) {

        console.error(error);

    }

}

        async function loadChat() {

    const token =
        localStorage.getItem(
            "token"
        );

    const response =
        await fetch(
            "http://localhost:5000/api/chats",
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

    const result =
        await response.json();

    const chats =
        result.data || [];
        console.log(
    "Chats:",
    chats
);

   if (
    chats.length === 0
) {

    const createResponse =
        await fetch(
            "http://localhost:5000/api/chats",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    Authorization:
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    adminId: 1
                })
            }
        );

    const createResult =
        await createResponse.json();

    console.log(
        "CHAT CREATED:",
        createResult
    );

    return loadChat();

}

    activeChatId =
        chats[0].id;

    loadMessages();

}

async function loadMessages() {

    if (!activeChatId)
        return;

    const token =
        localStorage.getItem(
            "token"
        );

    const response =
        await fetch(
            `http://localhost:5000/api/chats/${activeChatId}/messages`,
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

    const result =
        await response.json();

    chatMessages =
        result.data || [];

    renderMessages();

}

     function renderMessages() {

    const user =
        JSON.parse(
            localStorage.getItem("user")
        );

    const scrollContainer =
        document.getElementById(
            "chatMessagesScroll"
        );

    scrollContainer.innerHTML = "";

    chatMessages.forEach(msg => {

        const bubble =
            document.createElement("div");

        const currentUserId =
            user.id || user.userId;

        const isMine =
            Number(msg.sender_id) ===
            Number(currentUserId);

        bubble.className =
            `chat-bubble ${
                isMine
                    ? "user"
                    : "admin"
            }`;

        try {

    const requestData =
        JSON.parse(
            msg.message
        );

    if (
        requestData.type ===
        "request_card"
    ) {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "request-card";

        card.innerHTML = `
            <div class="request-card-header">

                <div>

                    <h3>
                        Customer Request
                    </h3>

                    <p>
                        Request #${requestData.requestCode}
                    </p>

                </div>

                <span class="request-status">
    ${requestData.status || "Open"}
</span>

            </div>

            <div class="request-card-body">

                <div>
                    <small>
                        Request Type
                    </small>

                    <strong>
                        ${requestData.requestType}
                    </strong>
                </div>

                <div>
                    <small>
                        Status
                    </small>

                    <strong>
    ${requestData.status || "Pending"}
</strong>
                </div>

            </div>

           <div class="request-card-actions">

    <button
    class="view-request-btn"
    onclick="openModal(${requestData.requestId})"
>
    <i class="fas fa-eye"></i>
    View
</button>

</div>
        `;

        scrollContainer.appendChild(
            card
        );

        return;

    }
   

}


catch {

    bubble.textContent =
        msg.message;

    scrollContainer.appendChild(
        bubble
    );

}



    });

    scrollContainer.scrollTop =
        scrollContainer.scrollHeight;

}

async function sendMessage() {
console.log("SEND BUTTON CLICKED");
    const input =
        document.getElementById(
            "chatInputText"
        );

    const message =
        input.value.trim();

    if (
        !message ||
        !activeChatId
    ) {
        return;
    }

    const token =
        localStorage.getItem(
            "token"
        );

    const response =
        await fetch(
            `http://localhost:5000/api/chats/${activeChatId}/messages`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                    Authorization:
                        `Bearer ${token}`
                },
                body: JSON.stringify({
                    message
                })
            }
        );

const result =
    await response.json();

console.log(
    "SEND RESULT:",
    result
);

    input.value = "";

    loadMessages();

}

        function checkEnterKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function toggleAttachmentMenu() {
            const menu = document.getElementById('attachmentMenu');
            menu.classList.toggle('active');
        }

        let currentUploadType = 'image';
        function triggerFileInput(type) {
            currentUploadType = type;
            const fileInput = document.getElementById('hiddenFileInput');
            if (type === 'image') {
                fileInput.accept = 'image/*';
            } else {
                fileInput.accept = '.pdf,.doc,.docx,.txt';
            }
            fileInput.click();
            toggleAttachmentMenu();
        }


 
        window.addEventListener('click', function(e) {
            const menu = document.getElementById('attachmentMenu');
            const plusBtn = document.querySelector('.chat-action-btn:last-child');
            if (menu && plusBtn && !menu.contains(e.target) && !plusBtn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        
async function viewRequest(requestId) {

    document.getElementById(
        "modalRequestCode"
    ).textContent = "TEST";

    document.getElementById(
        "modalType"
    ).textContent = "TEST";

    document.getElementById(
        "modalQuantity"
    ).textContent = "1";

    document.getElementById(
        "modalStatus"
    ).textContent = "PENDING";

    document.getElementById(
        "modalDescription"
    ).textContent = "HELLO WORLD";

    document.getElementById(
        "requestModal"
    ).style.display = "flex";

}

function closeRequestModal() {

    document.getElementById(
        "requestModal"
    ).style.display =
        "none";

}

async function openModal(requestId) {

    const token =
        localStorage.getItem(
            "token"
        );

    const response =
        await fetch(
            `http://localhost:5000/api/custom-requests/${requestId}`,
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

    const result =
        await response.json();

    const request =
        result.data;

    document.getElementById(
        "modalContent"
    ).innerHTML = `

        <div style="
            background:#f8fafc;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
        ">

            <h3>
                Customer Information
            </h3>

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:15px;
            ">

                <div>
                    <small>Customer</small>
                    <p>
                        <strong>
                            ${request.customer_name || "N/A"}
                        </strong>
                    </p>
                </div>

                <div>
                    <small>Email</small>
                    <p>
                        <strong>
                            ${request.email || "N/A"}
                        </strong>
                    </p>
                </div>

                <div>
                    <small>Contact No.</small>
                    <p>
                        <strong>
                            ${request.contact_number || "N/A"}
                        </strong>
                    </p>
                </div>

                <div>
                    <small>Date Submitted</small>
                    <p>
                        <strong>
                            ${new Date(
                                request.created_at
                            ).toLocaleDateString()}
                        </strong>
                    </p>
                </div>

            </div>

        </div>

        <h3>${request.request_code}</h3>

        <p>
            <strong>Type:</strong>
            ${request.request_type}
        </p>

        <p>
            <strong>Quantity:</strong>
            ${request.quantity}
        </p>

        <p>
            <strong>Status:</strong>
            ${request.status}
        </p>

        <p>
            <strong>Description:</strong>
        </p>

        <p>
            ${request.description}
        </p>

        <p>
            <strong>Notes:</strong>
        </p>

        <p>
            ${request.additional_notes || "None"}
        </p>

       ${
    request.reference_image
        ? `
            <div style="
                margin-top:20px;
            ">

                <strong>
                    Reference Image
                </strong>

                <br><br>

                <img
                    src="http://localhost:5000${request.reference_image}"
                    alt="Reference Image"
                    style="
                        max-width:100%;
                        max-height:300px;
                        object-fit:contain;
                        border:1px solid #e2e8f0;
                        border-radius:8px;
                    "
                >

            </div>
          `
        : `
            <p>
                <strong>
                    Reference Image:
                </strong>
                None
            </p>
          `
}
    `;

    document.getElementById(
        "myModal"
    ).style.display =
        "block";

}

function closeModal() {

    document.getElementById(
        "myModal"
    ).style.display = "none";

}
``
    </script>
    <div id="requestModal" style="display:none;">
    <div style="background:white;padding:20px;border:1px solid black;">

        <h2 id="modalRequestCode"></h2>

        <p>
            Type:
            <span id="modalType"></span>
        </p>

        <p>
            Quantity:
            <span id="modalQuantity"></span>
        </p>

        <p>
            Status:
            <span id="modalStatus"></span>
        </p>

        <p id="modalDescription"></p>

        <button onclick="closeRequestModal()">
            Close
        </button>

    </div>
</div>
</body>
</html>
